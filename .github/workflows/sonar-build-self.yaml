name: CI

on: [push]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Maven
        uses: stCarpentier/setup-maven@v5
        with:
          maven-version: '3.9.11'

      - name: Check Java and Maven
        shell: powershell
        run: |
          java -version
          mvn -version

      - name: Check Sonar Token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          if ([string]::IsNullOrEmpty($env:SONAR_TOKEN)) {
            Write-Host "SONAR_TOKEN is NOT available"
            exit 1
          }
          else {
            Write-Host "SONAR_TOKEN is available"
          }

      - name: Check SonarQube
        shell: powershell
        run: |
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:9000" -UseBasicParsing
            Write-Host "SonarQube is reachable. HTTP Status: $($response.StatusCode)"
          }
          catch {
            Write-Host "SonarQube is NOT reachable"
            Write-Host $_.Exception.Message
            exit 1
          }

      - name: Run Maven Build
        shell: powershell
        run: |
          mvn clean verify

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          mvn sonar:sonar `
            "-Dsonar.host.url=http://localhost:9000" `
            "-Dsonar.projectKey=JavaUpskil" `
            "-Dsonar.token=$env:SONAR_TOKEN" 
