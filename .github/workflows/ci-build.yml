name: Java CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          javac -version
          mvn -version

      - name: Build
        run: mvn clean verify